kind = "web"
previewPath = "/"
title = "Prayag Production Analytics"
version = "1.0.0"
id = "artifacts/prayag-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21800

[services.development]
run = "cd /home/runner/workspace/artifacts/prayag && PORT=21800 python3 app.py"

[services.env]
PORT = "21800"

[services.production.run]
args = ["python3", "-m", "gunicorn", "--bind", "0.0.0.0:21800", "--chdir", "/home/runner/workspace/artifacts/prayag", "--workers", "1", "--threads", "8", "--worker-class", "gthread", "--timeout", "120", "--graceful-timeout", "30", "app:app"]

[services.production.run.env]
PORT = "21800"

[services.production.health.startup]
path = "/health"
