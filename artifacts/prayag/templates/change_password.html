<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Set your password — Prayag Production Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>:root { --navy:#1F3864; --terra:#C55A11; } body { background:#f3f4f6; }</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <main class="w-full max-w-sm">
    <div class="text-center mb-7">
      <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl text-white text-xl font-black" style="background:var(--navy)">P</div>
      <h1 class="mt-4 text-xl font-bold" style="color:var(--navy)">Set your password</h1>
      <p class="mt-1 text-sm text-gray-500">For your account security, choose a personal password before continuing.</p>
    </div>
    <section class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
      {% if error %}<div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</div>{% endif %}
      <form method="post" action="/change-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
        <label class="block text-xs font-semibold text-gray-700 mb-1" for="password">New password</label>
        <input id="password" required minlength="8" name="password" type="password" autocomplete="new-password"
               class="mb-4 w-full rounded-xl border border-gray-300 px-3 py-2.5 text-sm outline-none focus:ring-2" style="--tw-ring-color:var(--navy)"/>
        <label class="block text-xs font-semibold text-gray-700 mb-1" for="confirm_password">Confirm new password</label>
        <input id="confirm_password" required minlength="8" name="confirm_password" type="password" autocomplete="new-password"
               class="mb-5 w-full rounded-xl border border-gray-300 px-3 py-2.5 text-sm outline-none focus:ring-2" style="--tw-ring-color:var(--navy)"/>
        <button type="submit" class="w-full rounded-xl py-2.5 text-sm font-bold text-white" style="background:var(--navy)">Save password and continue</button>
      </form>
    </section>
    <p class="mt-5 text-center text-xs text-gray-400">Prayag Pipes &amp; Fittings — Internal Use Only</p>
  </main>
  {% include "_activity_heartbeat.html" %}
</body>
</html>
